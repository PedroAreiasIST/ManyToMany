name: connectivity-benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python benchmark libraries (each optional)
        run: |
          python -m pip install --upgrade pip
          pip install numpy psutil libigl vtk
          pip install openmesh || echo "openmesh wheel unavailable on this runner; it will appear as N/A"

      - name: Build MM3 benchmark bridge
        run: dotnet build Benchmarks/Mm3Bench/Mm3Bench.csproj -c Release

      - name: Run connectivity benchmark
        run: |
          python Benchmarks/mesh_connectivity_benchmark.py \
            --quick --repeats 3 \
            --mm3-project ./Benchmarks/Mm3Bench \
            --out results

      - name: Publish table to job summary
        if: always()
        run: |
          { echo '## Connectivity benchmark'; echo; cat results.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-benchmark-results
          path: |
            results.md
            results.csv
            results.tex
